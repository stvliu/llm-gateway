spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: false
  flyway:
    enabled: false

gateway:
  catalog:
    sync:
      # 测试环境关闭定时自动同步，避免启动即触发真实 models.dev 拉取与数据初始化竞态
      auto-enabled: false
    probe:
      # 测试环境关闭上游列表探测定时装配，避免 @SpringBootTest 长时间运行触发真实探测
      auto-enabled: false
  audit:
    cleanup:
      # 测试环境关闭定时清理，避免集成测试期间清理审计日志干扰测试数据
      enabled: false

logging:
  level:
    com.codingas.gateway: DEBUG
    org.springframework: WARN
