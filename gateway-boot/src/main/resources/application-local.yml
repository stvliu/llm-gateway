# ==============================================
# Local 开发环境配置
# ==============================================

spring:
  # H2 Console 启用
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true

  # 开发环境 JPA 配置
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # 开发环境日志
  logging:
    level:
      root: INFO
      com.codingas.gateway: DEBUG
      org.springframework.web: DEBUG
      org.hibernate.SQL: INFO

# 服务端口
server:
  port: 8080

# SaToken 日志启用
sa-token:
  is-log: true

# 开发环境加密密钥
# 生产环境必须通过环境变量 GATEWAY_ENCRYPTION_KEY 配置
# 生成方式: openssl rand -base64 32
# 注意：此密钥仅用于本地开发，重启后加密数据将无法解密
gateway:
  security:
    encryption-key: ${GATEWAY_ENCRYPTION_KEY:}
