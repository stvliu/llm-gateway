# ==============================================
# PostgreSQL 生产环境配置
# ==============================================

spring:
  # ==============================================
  # 数据源配置
  # ==============================================
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:10}

  # ==============================================
  # JPA 配置
  # ==============================================
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  # ==============================================
  # H2 Console 配置（生产环境禁用）
  # ==============================================
  h2:
    console:
      enabled: false

  # ==============================================
  # Redis 配置（生产环境启用，恢复 Redis 健康检查）
  # ==============================================
  management:
    health:
      redis:
        enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# ==============================================
# 日志配置
# ==============================================
logging:
  level:
    root: INFO
    com.codingas.gateway: INFO
