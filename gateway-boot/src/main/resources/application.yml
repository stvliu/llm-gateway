# ==============================================
# LLM Gateway 应用配置
# 环境: local / dev / prod
# ==============================================

spring:
  application:
    name: llm-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # ==============================================
  # 数据源配置
  # ==============================================
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/gateway;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: gateway-hikari-pool

  # ==============================================
  # JPA 配置
  # ==============================================
  jpa:
    hibernate:
      ddl-auto: update  # 开发环境使用 update，自动同步 schema
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: false
        jdbc:
          batch_size: 50
          fetch_size: 100
        order_inserts: true
        order_updates: true

  # ==============================================
  # Flyway 数据库迁移配置
  # 默认使用 H2 数据库，PostgreSQL 配置见 application-postgresql.yml
  # ==============================================
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    # 只使用通用迁移，H2 特定迁移通过 profile 添加
    locations: classpath:db/migration
    validate-on-migrate: true
    table: flyway_schema_history

  # ==============================================
  # H2 Console 配置（仅 local/dev 环境）
  # ==============================================
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  # ==============================================
  # 缓存配置
  # ==============================================
  cache:
    type: simple
    cache-null-values: false
    simple:
      maximum-size: 1000

  # ==============================================
  # Redis 配置（启用时设置 spring.cache.type=redis）
  # ==============================================
  data:
    redis:
      enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms

# ==============================================
# 服务器配置
# ==============================================
server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024

# ==============================================
# SaToken 安全配置
# ==============================================
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 7200
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: true
  is-read-cookie: false
  is-read-header: true
  is-token-offline: false

# ==============================================
# WebClient HTTP 客户端配置
# ==============================================
webclient:
  connect-timeout: 5000
  read-timeout: 60000
  write-timeout: 30000
  max-in-memory-size: 10MB

# ==============================================
# Jackson 配置
# ==============================================
jackson:
  date-format: yyyy-MM-dd HH:mm:ss
  time-zone: Asia/Shanghai
  serialization:
    write-dates-as-timestamps: false
    fail-on-empty-beans: false
  deserialization:
    fail-on-unknown-properties: false

# ==============================================
# 异步任务配置
# ==============================================
spring.task:
  execution:
    pool:
      core-size: 8
      max-size: 16
      queue-capacity: 100
    thread-name-prefix: gateway-async-
  scheduling:
    pool:
      size: 4
    thread-name-prefix: gateway-sched-

# ==============================================
# 可观测性配置
# ==============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,traces
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      group:
        liveness:
          include: ping
        readiness:
          include: db, providerRegistry
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

# ==============================================
# 网关配置
# ==============================================
gateway:
  init:
    demo-data-enabled: false
  actuator:
    health:
      public-access: true
  health:
    provider:
      stale-threshold: 300s
      failure-threshold: 3
      success-threshold: 2
      probe-timeout: 10s

# ==============================================
# 日志配置（由 logback-spring.xml 管理）
# ==============================================
logging:
  level:
    root: INFO
    com.codingas.gateway: DEBUG
    # Hibernate 通过 JDBC PooledConnection 接口读取连接池元数据时，
    # HikariCP 不暴露这些信息，INFO 日志会显示 undefined/unknown，无实际影响
    org.hibernate.orm.connections.pooling: WARN
