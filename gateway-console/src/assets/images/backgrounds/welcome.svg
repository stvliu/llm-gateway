<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 770" width="1140" height="770">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f7ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1890ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#722ed1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1140" height="770" fill="url(#bgGrad)"/>

  <!-- Decorative circles -->
  <circle cx="926" cy="128" r="103" fill="#1890ff" opacity="0.1"/>
  <circle cx="998" cy="642" r="154" fill="#722ed1" opacity="0.08"/>
  <circle cx="128" cy="577" r="77" fill="#1890ff" opacity="0.1"/>

  <!-- Main illustration - AI Gateway concept -->
  <g transform="translate(368, 193)">
    <!-- Central hub -->
    <circle cx="256" cy="193" r="77" fill="url(#primaryGrad)" opacity="0.9"/>
    <circle cx="256" cy="193" r="51" fill="white"/>
    <circle cx="256" cy="193" r="26" fill="url(#primaryGrad)"/>

    <!-- Connection lines -->
    <line x1="256" y1="116" x2="256" y2="26" stroke="#1890ff" stroke-width="4" opacity="0.6"/>
    <line x1="256" y1="269" x2="256" y2="359" stroke="#1890ff" stroke-width="4" opacity="0.6"/>
    <line x1="179" y1="193" x2="77" y2="193" stroke="#1890ff" stroke-width="4" opacity="0.6"/>
    <line x1="333" y1="193" x2="435" y2="193" stroke="#1890ff" stroke-width="4" opacity="0.6"/>

    <!-- Diagonal lines -->
    <line x1="201" y1="137" x2="128" y2="64" stroke="#722ed1" stroke-width="3" opacity="0.5"/>
    <line x1="311" y1="137" x2="384" y2="64" stroke="#722ed1" stroke-width="3" opacity="0.5"/>
    <line x1="201" y1="248" x2="128" y2="321" stroke="#722ed1" stroke-width="3" opacity="0.5"/>
    <line x1="311" y1="248" x2="384" y2="321" stroke="#722ed1" stroke-width="3" opacity="0.5"/>

    <!-- Provider nodes -->
    <circle cx="256" cy="26" r="32" fill="#10a37f" opacity="0.9"/>
    <text x="256" y="33" font-size="18" fill="white" text-anchor="middle" font-weight="bold">AI</text>

    <circle cx="256" cy="359" r="32" fill="#d97757" opacity="0.9"/>
    <text x="256" y="366" font-size="18" fill="white" text-anchor="middle" font-weight="bold">A</text>

    <circle cx="77" cy="193" r="32" fill="#4285f4" opacity="0.9"/>
    <text x="77" y="200" font-size="15" fill="white" text-anchor="middle" font-weight="bold">G</text>

    <circle cx="435" cy="193" r="32" fill="#ff6b35" opacity="0.9"/>
    <text x="435" y="200" font-size="14" fill="white" text-anchor="middle" font-weight="bold">AZ</text>

    <!-- Corner nodes -->
    <circle cx="128" cy="64" r="23" fill="#667eea" opacity="0.8"/>
    <circle cx="384" cy="64" r="23" fill="#764ba2" opacity="0.8"/>
    <circle cx="128" cy="321" r="23" fill="#11998e" opacity="0.8"/>
    <circle cx="384" cy="321" r="23" fill="#38ef7d" opacity="0.8"/>
  </g>

  <!-- Text -->
  <text x="570" y="667" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" fill="#1f1f1f" text-anchor="middle" font-weight="600">
    统一接入，智能路由
  </text>
  <text x="570" y="719" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" fill="#666" text-anchor="middle">
    OpenAI / Anthropic / Google / Azure
  </text>
</svg>