# ===================================================================
# 开发环境配置 (application-dev.yml)
# ===================================================================

# 日志级别
logging:
  level:
    root: INFO
    com.llm.gateway: DEBUG
    com.llm.gateway.adapter: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %highlight(%-5level) %cyan(%logger{36}) - %msg%n"

# H2 Console 启用
spring:
  h2.console:
    enabled: true
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# 开发环境 Redis (可选)
spring.data.redis:
  host: localhost
  port: 6379

# CORS 允许所有来源 (开发环境)
gateway:
  cors:
    allowed-origins: "*"
  llm:
    timeout-seconds: 60
