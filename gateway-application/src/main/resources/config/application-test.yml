# ===================================================================
# 测试环境配置 (application-test.yml)
# ===================================================================

# 日志级别
logging:
  level:
    root: WARN
    com.llm.gateway: INFO
    org.springframework.web: WARN

# 数据库 - 使用 H2 内存数据库
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

# Flyway - 测试环境禁用
spring.flyway:
  enabled: false

# 测试环境 Redis (可选)
spring.data.redis:
  host: localhost
  port: 6379

# CORS 配置
gateway:
  cors:
    allowed-origins: "http://localhost:3000"
