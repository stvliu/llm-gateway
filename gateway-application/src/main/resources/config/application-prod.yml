# ===================================================================
# 生产环境配置 (application-prod.yml)
# ===================================================================

# 日志级别 - 生产环境减少日志量
logging:
  level:
    root: WARN
    com.codingasgateway: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
  # JSON 格式日志
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n"

# 数据库 - PostgreSQL
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:llm_gateway}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

# H2 Console 禁用
spring.h2.console:
  enabled: false

# Redis
spring.data.redis:
  host: ${REDIS_HOST:redis}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  database: ${REDIS_DATABASE:0}
  ssl:
    enabled: ${REDIS_SSL:false}

# CORS - 生产环境需要配置具体域名
gateway:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allow-credentials: true
  llm:
    timeout-seconds: 30
    max-retries: 3

# OpenTelemetry
gateway.otel:
  enabled: true
  endpoint: ${OTEL_ENDPOINT:http://otel-collector:4317}

# Actuator 安全
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
