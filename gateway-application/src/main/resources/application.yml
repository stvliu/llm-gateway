# ===================================================================
# LLM-Gateway 配置文件
# 文档: https://docs.llm-gateway.dev
# ===================================================================

# 应用名称
spring.application.name: llm-gateway

# 应用环境 (dev/test/staging/prod)
spring.profiles.active: ${SPRING_PROFILES_ACTIVE:dev}

# 配置文件位置
spring.config.import: optional:file:./config/application-${spring.profiles.active}.yml

# ===================================================================
# 服务器配置
# ===================================================================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  # 虚拟线程配置 (JDK 21)
  threads:
    virtual:
      enabled: true
  # 关闭信号
  shutdown: graceful
  # Tomcat 连接数配置
  tomcat:
    threads:
      max: 200
      min-spare: 10
    max-connections: 10000
    accept-count: 100

# ===================================================================
# Spring Boot 应用配置
# ===================================================================
spring:
  application:
    name: llm-gateway
    index-directory: true

  # 异步任务配置
  task:
    execution:
      pool:
        core-size: 8
        max-size: 64
        queue-capacity: 1024
      thread-name-prefix: gateway-async-

  # 懒加载 Bean (提升启动速度)
  lazy-initialization: ${SPRING_LAZY_INITIALIZATION:false}

  # 关闭不需要的自动配置
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# ===================================================================
# 数据库配置
# ===================================================================
spring.datasource:
  # 开发环境使用 H2
  url: jdbc:h2:mem:llm_gateway;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
  driver-class-name: org.h2.Driver
  username: ${DB_USERNAME:sa}
  password: ${DB_PASSWORD:}
  # 连接池配置
  hikari:
    minimum-idle: 5
    maximum-pool-size: 20
    idle-timeout: 300000
    max-lifetime: 1200000
    connection-timeout: 30000

# JPA 配置
spring.jpa:
  open-in-view: false
  properties:
    hibernate:
      dialect: org.hibernate.dialect.H2Dialect
      format_sql: true
      use_sql_comments: true
      jdbc:
        time_zone: UTC
  hibernate:
    ddl-auto: validate
  show-sql: false

# H2 Console (仅开发环境)
spring.h2.console:
  enabled: true
  path: /h2-console

# Flyway 数据库迁移
spring.flyway:
  enabled: true
  baseline-on-migrate: true
  locations: classpath:db/migration
  table: flyway_schema_history
  validate-on-migrate: true

# ===================================================================
# Redis 配置 (企业版)
# ===================================================================
spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  database: ${REDIS_DATABASE:0}
  timeout: 5000ms
  lettuce:
    pool:
      max-active: 20
      max-idle: 10
      min-idle: 5
      max-wait: 3000ms

# ===================================================================
# 安全配置
# ===================================================================
spring.security:
  # 用户密码配置 (仅开发环境)
  user:
    name: admin
    password: ${ADMIN_PASSWORD:admin123}
    roles: ADMIN

# Sa-Token 配置
sa-token:
  # Token 名称 (同时支持 Cookie 和 Header)
  token-name: Authorization
  # Token 有效期 (秒)
  timeout: 86400
  # Token 活跃时间 (秒)
  active-timeout: -1
  # 是否允许同一账号并发登录
  concurrent: false
  # 开启注解鉴权
  annotation-enabled: true
  # 错误处理
  error-handler: com.codingas.gateway.web.config.SaTokenErrorHandler

# ===================================================================
# API 限流配置
# ===================================================================
gateway.rate-limit:
  enabled: true
  default-rpm: 1000
  default-tpm: 100000

# ===================================================================
# 网关配置
# ===================================================================
gateway:
  # 安全配置 (必须设置 encryption-key)
  security:
    # AES-256 加密密钥 (Base64 编码, 32 字节)
    # 生成方式: openssl rand -base64 32
    encryption-key: ${ENCRYPTION_KEY:}
  # LLM 路由配置
  llm:
    routing-strategy: PRIORITY
    max-retries: 3
    timeout-seconds: 30
    # 请求体大小限制
    max-request-body-size: 10MB
  # 适配器配置
  adapter:
    openai:
      base-url: https://api.openai.com
      timeout-seconds: 30
    anthropic:
      base-url: https://api.anthropic.com
      version: 2023-06-01
      timeout-seconds: 30
  # CORS 配置
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  # OpenTelemetry 配置
  otel:
    enabled: ${OTEL_ENABLED:false}
    endpoint: ${OTEL_ENDPOINT:http://localhost:4317}
    service-name: llm-gateway

# ===================================================================
# 日志配置
# ===================================================================
logging:
  level:
    root: INFO
    # 特定包的日志级别
    com.codingas.gateway: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  # 日志格式
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  # 日志文件 (生产环境)
  file:
    name: logs/llm-gateway.log
    max-size: 100MB
    max-history: 30

# ===================================================================
# Actuator 配置
# ===================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: ${OTEL_ENABLED:false}
    sampling:
      probability: 1.0

# ===================================================================
# SpringDoc OpenAPI 配置
# ===================================================================
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false
