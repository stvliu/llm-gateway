# ===================================================================
# 测试配置
# ===================================================================

# 测试环境使用 H2 内存数据库
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

# Flyway 禁用 (测试用 JPA ddl-auto)
spring.flyway:
  enabled: false

# 测试用 Redis (可选)
spring.data.redis:
  host: localhost
  port: 6379

# 日志
logging:
  level:
    root: WARN
    com.llm.gateway: INFO
