# ===================================================================
# Release Workflow
# 发布工作流: Git tag 推送时触发
# ===================================================================
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  # -------------------------------------------------------------------
  # 发布准备
  # -------------------------------------------------------------------
  release:
    name: Release准备
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: LLM-Gateway ${{ steps.version.outputs.version }}
          draft: true
          prerelease: false

  # -------------------------------------------------------------------
  # 构建 Docker 镜像 (多架构)
  # -------------------------------------------------------------------
  build-docker:
    name: 构建Docker镜像
    runs-on: ubuntu-latest
    needs: release
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SPRING_PROFILES_ACTIVE=prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.release.outputs.version }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.platform }}
          path: sbom.spdx.json
          retention-days: 90

  # -------------------------------------------------------------------
  # 构建系统安装包 (deb/rpm/zip) - 单 windows job，JReleaser 纯 Java 跨平台
  # -------------------------------------------------------------------
  package:
    name: 构建安装包
    needs: release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Restore script permissions
        # Windows checkout 丢失 +x，git bash 环境需恢复
        run: |
          chmod +x mvnw
          chmod +x deployments/package/build.sh
          chmod +x deployments/package/bin/llm-gateway.sh
          chmod +x deployments/package/linux/postinst deployments/package/linux/prerm deployments/package/linux/postrm
        shell: bash

      # 不再需要：sudo apt-get install rpm（JReleaser 纯 Java 出 rpm）
      # 不再需要：choco install innosetup（Windows 改 zip）

      - name: Build packages
        run: bash deployments/package/build.sh
        shell: bash

      - name: Smoke test - deb
        # windows-latest runner 支持 docker（Linux 容器）跑 systemd smoke
        run: |
          DEB=$(ls deployments/package/dist/*.deb | head -1)
          docker run --rm -d --name lg-smoke-deb \
            --privileged --cgroupns=host \
            -v "$PWD/$DEB:/tmp/llm-gateway.deb" \
            jrei/systemd-ubuntu:22.04
          for i in $(seq 1 30); do
            state=$(docker exec lg-smoke-deb systemctl is-system-running 2>/dev/null || echo "")
            case "$state" in running|degraded) break;; esac
            sleep 1
          done
          docker exec lg-smoke-deb bash -c '
            apt-get update && apt-get install -y /tmp/llm-gateway.deb curl
            for i in $(seq 1 90); do curl -sf http://localhost:8080/actuator/health && break; sleep 1; done
            systemctl is-active llm-gateway.service
            # 验证 conf 占位符已替换 + JRE bin 可执行
            grep -q "__GENERATE_KEY__" /etc/llm-gateway/llmgateway.conf && { echo "占位符未替换"; exit 1; } || echo "conf 密钥已生成 OK"
            test -x /opt/llm-gateway/runtime/bin/java && echo "JRE bin/java 可执行 OK"
          '
          docker stop lg-smoke-deb
        shell: bash

      - name: Smoke test - rpm
        run: |
          RPM=$(ls deployments/package/dist/*.rpm | head -1)
          docker run --rm -d --name lg-smoke-rpm \
            --privileged --cgroupns=host \
            -v "$PWD/$RPM:/tmp/llm-gateway.rpm" \
            jrei/systemd-rockylinux:9
          for i in $(seq 1 30); do
            state=$(docker exec lg-smoke-rpm systemctl is-system-running 2>/dev/null || echo "")
            case "$state" in running|degraded) break;; esac
            sleep 1
          done
          docker exec lg-smoke-rpm bash -c '
            dnf install -y /tmp/llm-gateway.rpm curl
            for i in $(seq 1 90); do curl -sf http://localhost:8080/actuator/health && break; sleep 1; done
            systemctl is-active llm-gateway.service
            grep -q "__GENERATE_KEY__" /etc/llm-gateway/llmgateway.conf && { echo "占位符未替换"; exit 1; } || echo "conf 密钥已生成 OK"
            test -x /opt/llm-gateway/runtime/bin/java && echo "JRE bin/java 可执行 OK"
          '
          docker stop lg-smoke-rpm
        shell: bash

      - name: Smoke test - zip (Windows)
        run: |
          $Zip = (Get-ChildItem deployments/package/dist/*.zip | Select-Object -First 1).FullName
          Expand-Archive $Zip -DestinationPath C:\lg-smoke -Force
          C:\lg-smoke\bin\install.ps1
          for ($i=1; $i -le 90; $i++) {
            try { (Invoke-WebRequest -UseBasicParsing http://localhost:8080/actuator/health).Content; break } catch { Start-Sleep -Seconds 1 }
          }
          $svc = Get-Service llm-gateway
          if ($svc.Status -ne 'Running') { throw "服务未运行" }
          C:\lg-smoke\bin\uninstall.ps1
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            deployments/package/dist/*.deb
            deployments/package/dist/*.rpm
            deployments/package/dist/*.zip
          retention-days: 14

  # -------------------------------------------------------------------
  # 发布 Maven Central (可选)
  # -------------------------------------------------------------------
  publish-maven:
    name: 发布Maven Central
    runs-on: ubuntu-latest
    needs: release
    if: false  # 暂时禁用，等待完善签名配置

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Build and Publish
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
        run: |
          mvn deploy \
              -DskipTests \
              -Dspotless.apply.skip=true \
              -Dgpg.skip=false \
              -P release \
              ${{ env.MAVEN_OPTS }}

  # -------------------------------------------------------------------
  # 发布 Helm Chart
  # -------------------------------------------------------------------
  publish-helm:
    name: 发布Helm Chart
    runs-on: ubuntu-latest
    needs: release
    if: false  # 暂时禁用，charts/ 目录不存在

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Create Helm Chart
        run: |
          mkdir -p charts/llm-gateway
          cp -r deployments/helm/* charts/llm-gateway/

      - name: Package Helm Chart
        run: |
          helm package charts/llm-gateway \
            --version ${{ needs.release.outputs.version }} \
            --app-version ${{ needs.release.outputs.version }}

      - name: Upload Helm Chart
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: llm-gateway-${{ needs.release.outputs.version }}.tgz
          asset_name: llm-gateway-${{ needs.release.outputs.version }}.tgz
          asset_content_type: application/gzip

  # -------------------------------------------------------------------
  # 完成发布
  # -------------------------------------------------------------------
  finalize:
    name: 完成发布
    runs-on: ubuntu-latest
    needs: [release, build-docker, publish-helm, package]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: deployments/package/dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR deployments/package/dist

      - name: Update Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            *.tgz
            deployments/package/dist/*.deb
            deployments/package/dist/*.rpm
            deployments/package/dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Notification
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "LLM-Gateway ${{ needs.release.outputs.version }} 发布完成",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*LLM-Gateway 发布完成*\n版本: ${{ needs.release.outputs.version }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
