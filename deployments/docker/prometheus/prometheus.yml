# Prometheus 配置
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # LLM-Gateway 应用指标
  - job_name: 'llm-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gateway:8080']
    scrape_interval: 10s

  # OpenTelemetry Collector (如果使用)
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
