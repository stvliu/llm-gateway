# Grafana Dashboard 配置
apiVersion: 1

providers:
  - name: 'LLM-Gateway'
    orgId: 1
    folder: ''
    folderUid: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
