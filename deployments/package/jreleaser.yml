# JReleaser 配置：assemble 出 deb（DebAssembler 纯 Java）+ zip（ArchiveAssembler）+ rpm（JpackageAssembler，需 rpmbuild，留 CI release）
# 触发: mvn jreleaser:assemble -pl gateway-boot -Ppkg -Djreleaser.project.version=<version>
# basedir = repo root（jreleaser-maven-plugin 1.25.0 实测，日志 "basedir set to <repo root>"），所有路径相对 repo root
# installationPath: / 使 fileSet output 为完整系统路径（opt/.../etc/.../lib/...），避免前缀重复
# jar 由 build.sh 预复制为 gateway-boot/target/llmgateway.jar（固定名），fileSet includes 打入 bin/
# 维护脚本（postinst/prerm/postrm）通过 templateDirectory 的 control/*.tpl 注入
# conffile 机制: JReleaser 1.25.0 DebAssembler 不支持 conffile 字段，通过 templates/deb/control/conffiles.tpl
#   注入 conffiles 文件（copyTemplates 渲染去 .tpl 扩展名，打入 control.tar.zst），dpkg 识别为 conffile 升级保留
# 注: JReleaser 1.25.0 中 deb 是 DebAssembler（纯 Java，本地可验证），rpm 用 JpackageAssembler（需 rpmbuild，本地 SNAPSHOT 跳过留 CI）
project:
  name: llmgateway
  description: LLM-Gateway - 企业级 AI 模型 API 聚合网关
  authors: [LLM-Gateway]
  license: Apache-2.0
  copyright: 2026 LLM-Gateway
  stereotype: CLI
  languages:
    java:
      version: 21
      groupId: com.codingas.gateway
      artifactId: gateway-boot
      mainClass: org.springframework.boot.loader.launch.JarLauncher

distributions:
  llmgateway:
    type: SINGLE_JAR
    # artifacts 由 assembler 产出（deb/zip/rpm），不预声明源 artifact

assemble:
  # Linux deb（DebAssembler 纯 Java，本地 Windows 可验证，无需 dpkg-deb）
  deb:
    llmgateway:
      active: ALWAYS
      exported: true
      executable: llmgateway
      installationPath: /
      architecture: amd64
      templateDirectory: deployments/package/templates/deb
      fileSets:
        - input: deployments/package/jre
          output: opt/llmgateway/runtime
        - input: deployments/package/bin
          output: opt/llmgateway/bin
          includes: [llmgateway.sh]
        - input: gateway-boot/target
          output: opt/llmgateway/bin
          includes: [llmgateway.jar]
        - input: deployments/package/linux
          output: usr/lib/systemd/system
          includes: [llmgateway.service]
        - input: deployments/package/conf
          output: etc/llmgateway
          includes: [llmgateway.conf]
      control:
        packageName: llmgateway
        packageVersion: '{{projectVersionNumber}}'
        packageRevision: 1
        provides: llmgateway
        maintainer: LLM-Gateway <noreply@codingas.com>
        description: LLM-Gateway - 企业级 AI 模型 API 聚合网关
        homepage: https://github.com/stvliu/llm-gateway
        section: net
        priority: optional

  # Windows zip（ArchiveAssembler，本地可验证）
  archive:
    llmgateway-win:
      active: ALWAYS
      exported: true
      formats: [ZIP]
      platform:
        replacements:
          windows-x86_64: win
      fileSets:
        - input: deployments/package/jre-win
          output: runtime
        - input: deployments/package/windows
          output: bin
          includes: [WinSW.exe, llmgateway.xml, install.ps1, uninstall.ps1, start.ps1]
        - input: gateway-boot/target
          output: bin
          includes: [llmgateway.jar]
        - input: deployments/package/conf
          output: conf
          includes: [llmgateway.conf]

  # Linux rpm（JpackageAssembler，需 rpmbuild；active=RELEASE 使本地 SNAPSHOT 跳过，留 CI release 产出）
  # 已知限制: jpackage --resource-dir 对 rpm 仅支持覆盖完整 <packageName>.spec，不支持注入单独 maintainer 脚本
  #   （%post/%preun/%postun）；jpackage 也无 fileSets 概念，无法像 DebAssembler 那样包含 conf/systemd unit。
  #   因此 rpm 安装后不生成密钥、不注册 systemd（CANNOT_FIX，需为 rpm 单独编写 .spec 或重新评估 rpm 方案）。
  #   launcherAsService 可让 jpackage 自动注册 systemd 服务，但密钥生成逻辑仍需 spec 覆盖，留后续评估。
  jpackage:
    llmgateway:
      active: RELEASE
      exported: true
      attachPlatform: true
      runtimeImages:
        - path: deployments/package/jre
          platform: linux-x86_64
      mainJar:
        path: gateway-boot/target/llmgateway.jar
      applicationPackage:
        appName: llmgateway
        appVersion: '{{projectVersionNumber}}'
        vendor: LLM-Gateway
      linux:
        types: [rpm]
        packageName: llmgateway
        maintainer: LLM-Gateway <noreply@codingas.com>
        license: Apache-2.0
        installDir: /opt/llmgateway
        appRelease: 1
